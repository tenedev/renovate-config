name: Sync

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - default.json

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Sync to organizations
        env:
          GH_TOKEN: ${{ secrets.ORG_TOKEN }}
        run: |
          set -e

          REPO="renovate-config"

          ORGS=(
            "usezeryon"
            "usekono"
            "usezyxo"
            "tenelabs"
          )

          CURRENT_ORG="${GITHUB_REPOSITORY%%/*}"

          # Configure Git authentication for pushes
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

          # Configure commit identity
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for ORG in "${ORGS[@]}"; do
            if [[ "$ORG" == "$CURRENT_ORG" ]]; then
              continue
            fi

            TARGET="${ORG}/${REPO}"

            echo "==> Syncing ${TARGET}"

            if ! gh repo view "$TARGET" >/dev/null 2>&1; then
              echo "Creating ${TARGET}..."

              gh repo create "$TARGET" \
                --private
            fi

            rm -rf target

            gh repo clone "$TARGET" target

            cp default.json target/default.json

            cd target

            git add default.json

            if git diff --cached --quiet; then
              echo "No changes"
            else
              git commit -m "chore: sync default.json"
              git push
            fi

            cd ..

            echo "✓ ${TARGET} synced"
          done
